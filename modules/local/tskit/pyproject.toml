[tool.poetry]
name = "docker-tskit"
version = "0.5.2"
description = "Docker image with tskitetude software"
authors = ["Paolo Cozzi <bunop@libero.it>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
tskitetude = {git = "https://github.com/bunop/TSKITetude.git", rev = "e5a9f3c27fad0fb2291de4666cfcf14b6cc6d5a9"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
