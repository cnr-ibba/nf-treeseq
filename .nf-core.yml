  multiqc_config: false
  nextflow_config: false
  nf_test_content: false
nf_core_version: 3.5.1
repository_type: pipeline
template:
  author: Paolo Cozzi
  description: Generate TreeSequence files from genotype data
  force: false
  is_nfcore: false
  name: nf-treeseq
  org: cnr-ibba
  outdir: .
  skip_features:
